<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mai Vàng Phú Quý - Thanh toán</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="brand">
        <img class="brand-logo" src="assets/images/logo.svg" alt="Mai Vàng Phú Quý" />
        <div>
          <strong>Mai Vàng Phú Quý</strong>
          <div class="badge">Thanh toán</div>
        </div>
      </div>
      <div class="nav-links">
        <a href="cart.html">Giỏ hàng</a>
        <a href="services.html">Sản phẩm</a>
      </div>
    </nav>
  </header>

  <section class="section">
    <div class="section-title">
      <div>
        <h2>Thông tin thanh toán</h2>
        <p>Vui lòng nhập thông tin để xác nhận đơn hàng.</p>
      </div>
    </div>
    <div class="card">
      <form class="form-grid" data-validate method="post" action="server/checkout.php">
        <input type="text" name="fullname" placeholder="Họ và tên" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="tel" name="phone" placeholder="Số điện thoại" required />
        <input type="text" name="address" placeholder="Địa chỉ giao hàng" required />
        <select name="payment" required>
          <option value="">Phương thức thanh toán</option>
          <option value="bank">Chuyển khoản ngân hàng</option>
          <option value="cod">Thanh toán khi nhận hàng</option>
        </select>
        <textarea name="note" placeholder="Ghi chú thêm"></textarea>
        <button class="button" type="submit">Xác nhận thanh toán</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-grid">
      <div>
        <h3>Hỗ trợ thanh toán</h3>
        <p>Gọi hotline nếu cần hỗ trợ ngay.</p>
      </div>
      <div>
        <h4>Hotline</h4>
        <p>0909 123 456</p>
      </div>
      <div>
        <h4>Khác</h4>
        <a href="contact.html">Liên hệ</a>
      </div>
    </div>
  </footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
